[project]
name = "research-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.5.0",
    "beautifulsoup4>=4.15.0",
    "black>=26.10.1",
    "ddgs>=9.16.0",
    "flake8>=7.4.1",
    "httpx[http2]>=0.28.1",
    "isort>=9.0.2",
    "openai>=3.13.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "rich>=15.0.0",
    "structlog>=26.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 88
